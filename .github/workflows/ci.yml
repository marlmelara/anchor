name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Inside the runner there is nothing competing for the default ports.
  ANCHOR_TEST_DATABASE_URL: postgres://anchor:anchor@localhost:5432/anchor?sslmode=disable
  ANCHOR_DATABASE_URL: postgres://anchor:anchor@localhost:5432/anchor?sslmode=disable
  ANCHOR_REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI and the module can never drift.
          go-version-file: go.mod
          cache: true

      # go.mod and go.sum are easy to leave behind when commits stage explicit
      # paths. This catches that before it becomes a mystery build failure.
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Migrate
        run: go run ./cmd/anchorctl migrate

      # The race detector is not optional here: Anchor is a worker pool, and a
      # data race in the claim path would show up as lost or duplicated runs.
      - name: Test
        run: go test -race -count=1 ./...

      # Projection drift is a defect, so CI asserts the projections still agree
      # with the fold after the whole suite has written to the database.
      - name: Verify projections match the event log
        run: go run ./cmd/anchorctl rebuild -verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v8 of the action tracks golangci-lint v2, which is what .golangci.yml
      # is written against. The v6 action pins the v1 series, and a v1 binary
      # built with an older Go refuses to lint a module targeting a newer one.
      # The version is pinned rather than "latest" so a linter release cannot
      # turn a green branch red on its own.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          args: --timeout=5m
