services:
  postgres:
    image: postgres:17-alpine
    container_name: anchor-postgres
    environment:
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: anchor
      POSTGRES_DB: anchor
    ports:
      # 5433 on the host: 5432 is taken by another project on this machine.
      - "5433:5432"
    # max_connections is raised because every worker goroutine holds a pooled
    # connection for the duration of a claim transaction (SELECT ... FOR UPDATE
    # SKIP LOCKED), so pool size scales with worker count, not request rate.
    command: postgres -c max_connections=200 -c log_min_duration_statement=200
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor -d anchor"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: anchor-redis
    ports:
      - "6380:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
